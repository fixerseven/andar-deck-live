<svg class="hero-draw" viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A drawing of a business: stock, invoice, terms, and a gate that asks first">
  <g fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">

    <!-- datum: the flow line, left to right, running through the gate -->
    <line data-part="flow" x1="40" y1="300" x2="560" y2="300" stroke-dasharray="6 6" opacity=".55"/>
    <line data-part="flow-out" x1="596" y1="300" x2="748" y2="300" stroke-dasharray="6 6" opacity=".55"/>

    <!-- 01 STOCK: a rack with three bins, one bin highlighted as it "picks" -->
    <g data-group="stock">
      <rect x="46" y="196" width="108" height="104" rx="2"/>
      <line x1="46" y1="230" x2="154" y2="230"/>
      <line x1="46" y1="264" x2="154" y2="264"/>
      <rect data-part="stock-bin-1" x="54" y="204" width="30" height="22" rx="1"/>
      <rect data-part="stock-bin-2" x="92" y="204" width="30" height="22" rx="1"/>
      <rect data-part="stock-bin-3" x="130" y="204" width="16" height="22" rx="1"/>
      <rect x="54" y="238" width="92" height="22" rx="1" opacity=".5"/>
      <rect x="54" y="272" width="92" height="22" rx="1" opacity=".5"/>
      <line x1="100" y1="300" x2="100" y2="316"/>
    </g>

    <!-- 02 INVOICE: a document with three ruled lines and a small QR square -->
    <g data-group="invoice">
      <rect x="248" y="192" width="88" height="112" rx="2"/>
      <line x1="264" y1="212" x2="320" y2="212"/>
      <line data-part="inv-line-1" x1="264" y1="230" x2="320" y2="230" stroke-dasharray="56 56"/>
      <line data-part="inv-line-2" x1="264" y1="244" x2="320" y2="244" stroke-dasharray="56 56"/>
      <line data-part="inv-line-3" x1="264" y1="258" x2="308" y2="258" stroke-dasharray="44 44"/>
      <rect x="264" y="272" width="20" height="20" rx="1"/>
      <line x1="269" y1="277" x2="269" y2="287"/>
      <line x1="274" y1="277" x2="274" y2="287"/>
      <line x1="279" y1="277" x2="279" y2="287"/>
      <line x1="284" y1="277" x2="284" y2="287"/>
      <line x1="292" y1="300" x2="292" y2="316"/>
    </g>

    <!-- 03 TERMS: a ledger / calendar block with a "30 days" tag -->
    <g data-group="terms">
      <rect x="416" y="196" width="100" height="104" rx="2"/>
      <line x1="416" y1="214" x2="516" y2="214"/>
      <line x1="436" y1="196" x2="436" y2="214"/>
      <line x1="496" y1="196" x2="496" y2="214"/>
      <line x1="428" y1="234" x2="504" y2="234" opacity=".5"/>
      <line x1="428" y1="250" x2="504" y2="250" opacity=".5"/>
      <line x1="428" y1="266" x2="480" y2="266" opacity=".5"/>
      <g data-part="terms-tag">
        <rect x="428" y="276" width="64" height="18" rx="9" pathLength="100" stroke-dasharray="100"/>
        <text x="460" y="289" text-anchor="middle" font-family="'Barlow Semi Condensed', sans-serif" font-size="10" letter-spacing=".08em" stroke="none" fill="currentColor">30 DAYS</text>
      </g>
      <line x1="466" y1="300" x2="466" y2="316"/>
    </g>

    <!-- 04 THE GATE: a barrier across the flow line, with a stamp pad and a
         status light above it. Kept within the same y196-316 band as the
         other three parts so the bottom label row stays clear. -->
    <g data-group="gate">
      <!-- stamp pad -->
      <g data-part="stamp" style="transform-box:fill-box;transform-origin:578px 226px" opacity="0">
        <circle cx="578" cy="226" r="22" fill="var(--red, #D8401F)" fill-opacity=".92" stroke="var(--red, #D8401F)"/>
        <path d="M568 226 l7 7 l14 -16" stroke="var(--paper, #FAF9F5)" stroke-width="2.5" fill="none"/>
      </g>
      <line x1="578" y1="248" x2="578" y2="264" opacity=".5"/>
      <!-- waiting/status light -->
      <circle data-part="gate-dot" cx="578" cy="264" r="4" fill="currentColor" stroke="none"/>
      <line x1="578" y1="264" x2="578" y2="284" opacity=".5"/>
      <!-- the post the barrier hinges from (static) -->
      <line x1="578" y1="284" x2="578" y2="316"/>
      <!-- the barrier arm, rotates open about the post -->
      <g data-part="gate-bar" style="transform-box:fill-box;transform-origin:578px 300px">
        <line x1="578" y1="300" x2="614" y2="300" stroke-width="2.5"/>
        <line x1="583" y1="292" x2="591" y2="308" opacity=".6"/>
        <line x1="593" y1="292" x2="601" y2="308" opacity=".6"/>
        <line x1="603" y1="292" x2="611" y2="308" opacity=".6"/>
      </g>
    </g>

    <!-- balloons: circle + leader, engineering-drawing style -->
    <g data-group="balloons" font-family="'Barlow Semi Condensed', sans-serif" font-weight="600" stroke-width="1">
      <line x1="100" y1="150" x2="100" y2="196"/>
      <circle cx="100" cy="134" r="16"/>
      <text x="100" y="139" text-anchor="middle" font-size="14" stroke="none" fill="currentColor">01</text>

      <line x1="292" y1="150" x2="292" y2="192"/>
      <circle cx="292" cy="134" r="16"/>
      <text x="292" y="139" text-anchor="middle" font-size="14" stroke="none" fill="currentColor">02</text>

      <line x1="466" y1="150" x2="466" y2="196"/>
      <circle cx="466" cy="134" r="16"/>
      <text x="466" y="139" text-anchor="middle" font-size="14" stroke="none" fill="currentColor">03</text>

      <line x1="578" y1="150" x2="578" y2="196"/>
      <circle cx="578" cy="134" r="16"/>
      <text x="578" y="139" text-anchor="middle" font-size="14" stroke="none" fill="currentColor">04</text>
    </g>

    <!-- dim line with end ticks along the bottom -->
    <g data-group="dim" stroke-width="1">
      <line x1="46" y1="360" x2="748" y2="360"/>
      <line x1="46" y1="352" x2="46" y2="368"/>
      <line x1="748" y1="352" x2="748" y2="368"/>
    </g>
  </g>

  <!-- labels: .lab-style, under each part -->
  <g font-family="'Barlow Semi Condensed', sans-serif" font-size="11" letter-spacing=".12em" fill="currentColor" opacity=".68" text-anchor="middle">
    <text x="100" y="332">STOCK</text>
    <text x="292" y="332">INVOICE</text>
    <text x="466" y="332">TERMS</text>
    <text x="578" y="332">IT ASKS YOU FIRST</text>
    <text x="397" y="382" letter-spacing=".2em" font-size="10.5" opacity=".5">ONE OPERATION</text>
  </g>
</svg>
