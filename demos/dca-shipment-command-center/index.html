<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shipment Command Center — DCA Customs Brokerage</title>
<meta name="description" content="Concept prototype: connected shipment, document, dispatch and client-update operations for a Cebu customs brokerage. Fictional data." />
<style>
:root{
  color-scheme: light;

  --page:#F6F7F9;
  --surface:#FFFFFF;
  --surface-2:#FAFBFC;
  --surface-3:#F1F3F6;

  --ink:#151B23;
  --ink-2:#404B58;
  --ink-3:#6E7A88;
  --ink-4:#98A2AE;

  --line:#E5E9EE;
  --line-2:#D3D9E1;

  --cobalt:#1748C4;
  --cobalt-700:#0F3494;
  --cobalt-100:#DCE6FC;
  --cobalt-50:#EDF2FE;

  --amber:#B26A00;
  --amber-mark:#E9970C;
  --amber-50:#FDF3E3;

  --red:#B5301F;
  --red-mark:#D0402C;
  --red-50:#FBECE9;

  --green:#0F6B45;
  --green-mark:#1A8A5A;
  --green-50:#E9F4EE;

  --r:6px;
  --rail:214px;
  --sans:"Geist","Geist Sans",ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono","SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace;

  --shadow-panel:0 1px 2px rgba(21,27,35,.04), 0 12px 32px rgba(21,27,35,.10);
  --shadow-pop:0 1px 2px rgba(21,27,35,.05), 0 8px 24px rgba(21,27,35,.12);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--page);
  color:var(--ink);
  font-family:var(--sans);
  font-size:13px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--cobalt);text-decoration:none}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:3px}
::selection{background:var(--cobalt-100)}

svg{width:1em;height:1em;flex:0 0 auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.lbl{
  font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);
}
.muted{color:var(--ink-3)}
.tight{letter-spacing:-.012em}

/* ---------- shell ---------- */
.app{display:flex;height:100vh;overflow:hidden}

.rail{
  width:var(--rail);flex:0 0 var(--rail);
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
.brand{
  display:flex;align-items:center;gap:9px;
  padding:14px 14px 13px;border-bottom:1px solid var(--line);
}
.brand img{width:30px;height:30px;object-fit:contain;border-radius:3px;flex:0 0 30px}
.brand .bt{font-size:12.5px;font-weight:650;letter-spacing:-.015em;line-height:1.15}
.brand .bs{font-size:10.5px;color:var(--ink-4);letter-spacing:.02em;margin-top:1px}

.nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 9px;border-radius:var(--r);
  font-size:13px;font-weight:500;color:var(--ink-2);letter-spacing:-.008em;
  transition:background .12s ease,color .12s ease;
}
.nav button:hover{background:var(--surface-3)}
.nav button[aria-current="true"]{background:var(--cobalt-50);color:var(--cobalt-700);font-weight:600}
.nav button[aria-current="true"] .ico{color:var(--cobalt)}
.nav .ico{width:15px;height:15px;flex:0 0 15px;color:var(--ink-4);display:block}
.nav .cnt{
  margin-left:auto;font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums;
  color:var(--ink-4);
}
.nav button[aria-current="true"] .cnt{color:var(--cobalt-700)}
.nav .cnt.alert{color:var(--red);font-weight:600}

.rail-sec{margin-top:6px;padding:12px 14px 4px;border-top:1px solid var(--line)}
.duty{display:flex;flex-direction:column;gap:0;margin-top:8px}
.duty-row{display:flex;align-items:center;gap:8px;padding:5px 0;width:100%;text-align:left;border-radius:4px}
.duty-row:hover .dn{color:var(--cobalt-700)}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.dot.free{background:var(--green-mark)}
.dot.busy{background:var(--cobalt)}
.dot.hold{background:var(--amber-mark)}
.dn{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dw{margin-left:auto;font-size:10.5px;color:var(--ink-4);white-space:nowrap;max-width:82px;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}

.rail-foot{margin-top:auto;padding:12px 14px 13px;border-top:1px solid var(--line)}
.disclaimer{font-size:10.5px;line-height:1.42;color:var(--ink-4)}
/* Andar watermark — the firm that drew this, said quietly. The real logo,
   held small: restrained by size rather than by fading it out. Neutral ink,
   not the cobalt — a signature on the drawing, not part of the interface. */
.andar{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink-4);white-space:nowrap}
.andar .alogo{width:50px;height:12px;color:var(--ink-2);opacity:.85;flex:0 0 50px}

.byline{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.tb-andar{padding-right:11px;border-right:1px solid var(--line-2)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{
  height:50px;flex:0 0 50px;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.tb-title{font-size:14px;font-weight:620;letter-spacing:-.018em}
.tb-sub{font-size:11.5px;color:var(--ink-3);border-left:1px solid var(--line-2);padding-left:12px;margin-left:2px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  height:29px;padding:0 11px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--surface);
  font-size:12.5px;font-weight:500;color:var(--ink-2);letter-spacing:-.006em;
  transition:background .12s ease,border-color .12s ease,color .12s ease;
}
.btn:hover{background:var(--surface-3);border-color:#C2CAD4}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:550}
.btn.primary:hover{background:var(--cobalt-700);border-color:var(--cobalt-700)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-3)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink-2)}
.btn.sm{height:25px;padding:0 9px;font-size:11.5px}
.btn .ico{width:13px;height:13px;flex:0 0 13px}
.btn:disabled{opacity:.42;cursor:not-allowed}

.kbd{
  font-family:var(--mono);font-size:10px;padding:1px 4px;border:1px solid var(--line-2);
  border-radius:3px;color:var(--ink-4);background:var(--surface-2);line-height:1.5;
}

.view{flex:1;min-height:0;overflow:auto;position:relative}

/* ---------- generic blocks ---------- */
.wrap{padding:18px 20px 40px;max-width:1560px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-head h2{font-size:13px;font-weight:640;letter-spacing:-.012em;margin:0}
.sec-head .note{font-size:11.5px;color:var(--ink-4);margin-left:auto}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-head{
  display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);
}
.panel-head h3{font-size:12.5px;font-weight:620;letter-spacing:-.01em;margin:0}
.panel-head .rt{margin-left:auto;font-size:11px;color:var(--ink-4)}

/* status chips */
.chip{
  display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 7px;
  border-radius:3px;font-size:10.5px;font-weight:600;letter-spacing:.015em;
  border:1px solid transparent;white-space:nowrap;
}
.chip .sq{width:5px;height:5px;border-radius:1px}
.chip.ok{background:var(--green-50);color:var(--green);border-color:#CFE6DA}
.chip.ok .sq{background:var(--green-mark)}
.chip.warn{background:var(--amber-50);color:var(--amber);border-color:#F2DEBB}
.chip.warn .sq{background:var(--amber-mark)}
.chip.crit{background:var(--red-50);color:var(--red);border-color:#F1D2CC}
.chip.crit .sq{background:var(--red-mark)}
.chip.info{background:var(--cobalt-50);color:var(--cobalt-700);border-color:#CFDDFA}
.chip.info .sq{background:var(--cobalt)}
.chip.flat{background:var(--surface-3);color:var(--ink-3);border-color:var(--line)}
.chip.flat .sq{background:var(--ink-4)}

.urg{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.urg .bar{width:3px;height:11px;border-radius:1px}
.urg.high{color:var(--red)} .urg.high .bar{background:var(--red-mark)}
.urg.med{color:var(--amber)} .urg.med .bar{background:var(--amber-mark)}
.urg.low{color:var(--ink-3)} .urg.low .bar{background:var(--ink-4)}

.ai-tag{
  display:inline-flex;align-items:center;gap:4px;height:17px;padding:0 6px 0 5px;border-radius:3px;
  background:var(--cobalt-50);color:var(--cobalt-700);
  font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  border:1px solid #CFDDFA;
}
.ai-tag svg{width:10px;height:10px}

/* ---------- overview ---------- */
.metrics{
  display:grid;grid-template-columns:repeat(8,1fr);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
}
.metric{padding:11px 13px 12px;border-right:1px solid var(--line);text-align:left;width:100%;transition:background .12s ease}
.metric:last-child{border-right:0}
.metric:hover{background:var(--surface-2)}
.metric .mv{font-family:var(--mono);font-size:24px;font-weight:520;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.metric .ml{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.3;letter-spacing:-.004em}
.metric .md{font-size:10.5px;margin-top:5px;display:flex;align-items:center;gap:4px}
.metric.crit .mv{color:var(--red)}
.metric.warn .mv{color:var(--amber)}

.ov-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:16px;margin-top:16px;align-items:start}
.ov-col{display:flex;flex-direction:column;gap:16px}

.att-row{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  padding:10px 13px;border-bottom:1px solid var(--line);transition:background .12s ease;
}
.att-row:last-child{border-bottom:0}
.att-row:hover{background:var(--surface-2)}
.att-rank{
  font-family:var(--mono);font-size:10.5px;color:var(--ink-4);width:14px;flex:0 0 14px;
  padding-top:2px;font-variant-numeric:tabular-nums;
}
.att-stripe{width:2px;flex:0 0 2px;align-self:stretch;border-radius:1px;margin:1px 0}
.att-stripe.crit{background:var(--red-mark)}
.att-stripe.warn{background:var(--amber-mark)}
.att-stripe.info{background:var(--cobalt)}
.att-body{min-width:0;flex:1}
.att-t{display:block;font-size:12.5px;font-weight:550;letter-spacing:-.008em;line-height:1.35}
.att-m{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.att-m .sep{color:var(--line-2)}
.att-go{margin-left:auto;flex:0 0 auto;padding-top:2px;color:var(--ink-4);opacity:0;transition:opacity .12s ease}
.att-row:hover .att-go{opacity:1;color:var(--cobalt)}

.brief{border-left:2px solid var(--cobalt);background:linear-gradient(90deg,var(--cobalt-50),rgba(237,242,254,0) 62%)}
.brief-list{padding:4px 13px 12px;margin:0;list-style:none;display:flex;flex-direction:column;gap:0}
.brief-list li{
  display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(229,233,238,.75);
  font-size:12.5px;line-height:1.45;letter-spacing:-.006em;
}
.brief-list li:last-child{border-bottom:0}
.brief-list .bn{font-family:var(--mono);font-size:10.5px;color:var(--cobalt);padding-top:2px;flex:0 0 12px}
.brief-list a{font-weight:550;border-bottom:1px solid var(--cobalt-100)}
.brief-list a:hover{border-bottom-color:var(--cobalt)}

.tl{padding:4px 13px 12px;display:flex;flex-direction:column}
.tl-item{display:flex;gap:10px;padding:7px 0;position:relative}
.tl-item::before{
  content:"";position:absolute;left:3.5px;top:0;bottom:0;width:1px;background:var(--line);
}
.tl-item:first-child::before{top:11px}
.tl-item:last-child::before{bottom:auto;height:11px}
.tl-mark{
  width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:5px;position:relative;z-index:1;
  background:var(--surface);border:1.5px solid var(--ink-4);
}
.tl-mark.ok{border-color:var(--green-mark)}
.tl-mark.crit{border-color:var(--red-mark)}
.tl-mark.ai{border-color:var(--cobalt);background:var(--cobalt)}
.tl-mark.comm{border-color:var(--amber-mark)}
.tl-body{min-width:0;flex:1}
.tl-t{display:block;font-size:12px;line-height:1.4;letter-spacing:-.005em}
.tl-t b{font-weight:600}
.tl-m{font-size:10.5px;color:var(--ink-4);margin-top:2px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* ---------- kanban ---------- */
.filters{
  display:flex;align-items:center;gap:7px;padding:9px 16px;
  background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap;
}
.search{
  display:flex;align-items:center;gap:7px;height:29px;padding:0 9px;
  border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);min-width:250px;
  transition:border-color .12s ease,box-shadow .12s ease;
}
.search:focus-within{border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-50)}
.search input{border:0;outline:0;background:none;width:100%;font-size:12.5px}
.search input::placeholder{color:var(--ink-4)}
.search svg{width:13px;height:13px;color:var(--ink-4);flex:0 0 13px}
select.sel{
  height:29px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);
  padding:0 24px 0 9px;font-size:12.5px;color:var(--ink-2);cursor:pointer;
  appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' fill='none' stroke='%2398A2AE' stroke-width='1.4'%3E%3Cpath d='M3 4.75 6 7.75l3-3'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 7px center;background-size:11px;
}
select.sel:hover{border-color:#C2CAD4}
select.sel.on{border-color:var(--cobalt);color:var(--cobalt-700);background-color:var(--cobalt-50)}
.fcount{font-size:11.5px;color:var(--ink-4);margin-left:auto;white-space:nowrap}

.board{display:flex;gap:0;overflow-x:auto;height:100%;align-items:stretch;padding:0 0 0 0}
.col{
  flex:0 0 262px;width:262px;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line);background:var(--page);
}
.col:last-child{border-right:0}
.col.dragover{background:var(--cobalt-50)}
.col-head{
  display:flex;align-items:center;gap:7px;padding:10px 12px 9px;
  border-bottom:1px solid var(--line);background:var(--page);position:sticky;top:0;z-index:2;
}
.col-head .ct{font-size:11.5px;font-weight:620;letter-spacing:-.005em;color:var(--ink-2)}
.col-head .cc{
  font-family:var(--mono);font-size:10.5px;color:var(--ink-4);
  background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:0 5px;line-height:16px;
}
.col-head .cb{width:3px;height:11px;border-radius:1px;background:var(--line-2)}
.col-body{flex:1;overflow-y:auto;padding:9px 9px 40px;display:flex;flex-direction:column;gap:7px}
.col-empty{
  border:1px dashed var(--line-2);border-radius:var(--r);padding:14px 10px;text-align:center;
  font-size:11px;color:var(--ink-4);
}

.card{
  touch-action:none;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 10px 10px;text-align:left;width:100%;cursor:grab;position:relative;
  transition:border-color .12s ease,box-shadow .12s ease,transform .12s ease;
}
.card:hover{border-color:#C7D0DB;box-shadow:0 1px 3px rgba(21,27,35,.07)}
.card:active{cursor:grabbing}
.card.ghost{cursor:grabbing;margin:0}
.card.dragging{opacity:.4}
.card.flash{animation:flash 1.6s ease}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(23,72,196,0)}18%{box-shadow:0 0 0 3px var(--cobalt-100)}}
.card::before{
  content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:2px;border-radius:0 2px 2px 0;background:transparent;
}
.card.u-high::before{background:var(--red-mark)}
.card.u-med::before{background:var(--amber-mark)}
.card-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.card-ref{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:-.01em}
.card-mode{
  margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);
}
.card-mode svg{width:11px;height:11px}
.card-client{font-size:12.5px;font-weight:600;letter-spacing:-.012em;line-height:1.3}
.card-cargo{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.35}
.card-meta{
  display:flex;align-items:center;gap:5px;margin-top:7px;padding-top:7px;border-top:1px solid var(--line);
  font-size:11px;color:var(--ink-3);flex-wrap:wrap;
}
.card-meta .sep{color:var(--line-2)}
.card-block{
  margin-top:7px;display:flex;align-items:flex-start;gap:6px;
  padding:6px 7px;border-radius:4px;background:var(--red-50);border:1px solid #F1D2CC;
  font-size:11px;color:var(--red);line-height:1.35;font-weight:500;
}
.card-block.warn{background:var(--amber-50);border-color:#F2DEBB;color:var(--amber)}
.card-block svg{width:11px;height:11px;flex:0 0 11px;margin-top:2px}
.card-next{
  margin-top:6px;font-size:11px;color:var(--ink-2);display:flex;gap:5px;align-items:flex-start;line-height:1.35;
}
.card-next .arw{color:var(--cobalt);flex:0 0 auto;font-family:var(--mono)}
.card-foot{display:flex;align-items:center;gap:6px;margin-top:8px}
.av{
  width:19px;height:19px;border-radius:50%;flex:0 0 19px;display:grid;place-items:center;
  font-size:9px;font-weight:700;letter-spacing:.02em;color:#fff;background:var(--ink-3);
}
.av.c0{background:#1748C4}.av.c1{background:#0F6B45}.av.c2{background:#B26A00}
.av.c3{background:#5B4BB8}.av.c4{background:#0E6C7D}.av.c5{background:#8A3E7A}.av.c6{background:#3D4651}
.card-foot .who{font-size:11px;color:var(--ink-2)}
.card-foot .wait{margin-left:auto;font-size:10.5px;color:var(--ink-4);font-family:var(--mono);font-variant-numeric:tabular-nums}
.card-foot .wait.aging{color:var(--red);font-weight:600}

/* ---------- slide-over ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(21,27,35,.22);opacity:0;pointer-events:none;
  transition:opacity .2s ease;z-index:40;
}
.scrim.on{opacity:1;pointer-events:auto}
.slideover{
  position:fixed;top:0;right:0;bottom:0;width:600px;max-width:94vw;background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow-panel);z-index:41;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
}
.slideover.on{transform:translateX(0)}
.so-head{padding:14px 18px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.so-body{flex:1;overflow-y:auto;padding-bottom:36px}
.so-x{position:absolute;top:12px;right:14px;width:26px;height:26px;border-radius:var(--r);display:grid;place-items:center;color:var(--ink-4)}
.so-x:hover{background:var(--surface-3);color:var(--ink-2)}
.so-x svg{width:14px;height:14px}

.so-sec{padding:14px 18px;border-bottom:1px solid var(--line)}
.so-sec:last-child{border-bottom:0}
.so-sec-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.so-sec-h h4{font-size:11.5px;font-weight:640;letter-spacing:-.005em;margin:0}
.so-sec-h .rt{margin-left:auto;font-size:11px;color:var(--ink-4)}

.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px 14px}
.kv-i .k{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.kv-i .v{font-size:12.5px;margin-top:3px;letter-spacing:-.006em;line-height:1.35}

.docs{display:flex;flex-direction:column}
.doc{
  display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);
}
.doc:last-child{border-bottom:0}
.doc.na{opacity:.5}
.doc-n{font-size:12.5px;letter-spacing:-.006em;min-width:0}
.doc-s{display:block;font-size:10.5px;color:var(--ink-4);margin-top:2px;font-family:var(--mono);line-height:1.35}
.doc-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}

.ai-box{
  border:1px solid var(--cobalt-100);border-radius:var(--r);background:var(--cobalt-50);
  padding:11px 12px;
}
.ai-box.crit{border-color:#F1D2CC;background:var(--red-50)}
.ai-box-h{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.ai-box p{margin:0 0 7px;font-size:12.5px;line-height:1.5;letter-spacing:-.005em;color:var(--ink-2)}
.ai-box p:last-of-type{margin-bottom:0}
.ai-box .rec{
  margin-top:9px;padding-top:9px;border-top:1px solid rgba(23,72,196,.14);
  font-size:12.5px;line-height:1.45;color:var(--ink);
}
.ai-box.crit .rec{border-top-color:rgba(181,48,31,.16)}
.ai-box .rec b{font-weight:620}
.ai-note{
  margin-top:8px;font-size:10.5px;line-height:1.45;color:var(--ink-3);
  display:flex;gap:5px;align-items:flex-start;
}
.ai-note svg{width:11px;height:11px;flex:0 0 11px;margin-top:2px;color:var(--ink-4)}
.ai-acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

.msg{border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;background:var(--surface-2)}
.msg + .msg{margin-top:7px}
.msg.draft{border-color:var(--cobalt-100);background:var(--cobalt-50);border-style:dashed}
.msg-h{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.msg-ch{
  display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:650;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-4);
}
.msg-ch svg{width:11px;height:11px}
.msg-who{font-size:11.5px;font-weight:600;letter-spacing:-.005em}
.msg-t{margin-left:auto;font-size:10.5px;color:var(--ink-4);font-family:var(--mono)}
.msg-b{font-size:12.5px;line-height:1.5;color:var(--ink-2);letter-spacing:-.005em;white-space:pre-wrap}
.msg-f{display:flex;align-items:center;gap:6px;margin-top:9px}
.msg-f .warnnote{font-size:10.5px;color:var(--ink-4);margin-left:auto}

/* ---------- dispatch ---------- */
.disp{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:0;height:100%}
.disp-board{overflow:auto;min-width:0}
.disp-side{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto}
.staff{padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;transition:background .12s ease}
.staff:hover{background:var(--surface-2)}
.staff-h{display:flex;align-items:center;gap:8px}
.staff-n{display:block;font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.staff-role{display:block;font-size:10.5px;color:var(--ink-4);margin-top:1px}
.staff-b{margin-left:auto}
.staff-g{display:grid;grid-template-columns:auto 1fr;gap:3px 9px;margin-top:8px;font-size:11.5px}
.staff-g dt{color:var(--ink-4);font-size:10.5px;letter-spacing:.02em}
.staff-g dd{margin:0;color:var(--ink-2);letter-spacing:-.005em}

.asn{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;
  text-align:left;width:100%;transition:border-color .12s ease,box-shadow .12s ease;
}
.asn:hover{border-color:#C7D0DB;box-shadow:0 1px 3px rgba(21,27,35,.07)}
.asn.unassigned{border-style:dashed;border-color:var(--amber-mark);background:var(--amber-50)}
.asn.flash{animation:flash 1.6s ease}
.asn-t{font-size:12.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.asn-l{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.asn-g{display:flex;flex-direction:column;gap:3px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:11px}
.asn-g .r{display:flex;gap:8px;align-items:baseline}
.asn-g .r .k{color:var(--ink-4);width:74px;flex:0 0 74px;font-size:10.5px}
.asn-g .r .v{color:var(--ink-2);min-width:0}

/* ---------- documents ---------- */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;min-width:900px}
table.t th{
  text-align:left;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);
  padding:9px 13px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);
  position:sticky;top:0;z-index:1;
}
table.t td{padding:9px 13px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle;letter-spacing:-.005em}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr{cursor:pointer;transition:background .12s ease}
table.t tbody tr:hover{background:var(--surface-2)}
table.t td.r{text-align:right}

.readiness{display:flex;align-items:center;gap:7px}
.bar-track{display:block;width:64px;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;flex:0 0 64px}
.bar-fill{display:block;height:100%;min-width:2px;background:var(--cobalt);border-radius:2px}
.bar-fill.warn{background:var(--amber-mark)}
.bar-fill.crit{background:var(--red-mark)}
.bar-fill.ok{background:var(--green-mark)}

/* ---------- briefing ---------- */
.brief-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.85fr);gap:16px;align-items:start}
.qchips{display:flex;flex-wrap:wrap;gap:6px;padding:11px 13px;border-bottom:1px solid var(--line)}
.qchip{
  border:1px solid var(--line-2);border-radius:14px;padding:4px 10px;font-size:11.5px;color:var(--ink-2);
  background:var(--surface);transition:background .12s ease,border-color .12s ease,color .12s ease;letter-spacing:-.005em;
}
.qchip:hover{background:var(--cobalt-50);border-color:var(--cobalt-100);color:var(--cobalt-700)}

.thread{padding:13px;display:flex;flex-direction:column;gap:13px;min-height:200px;max-height:520px;overflow-y:auto}
.thread .empty{color:var(--ink-4);font-size:12px;text-align:center;padding:26px 10px;line-height:1.6}
.q{display:flex;gap:8px;align-items:flex-start}
.q .qi{
  width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;
  font-size:9px;font-weight:700;flex:0 0 18px;margin-top:1px;
}
.q .qt{font-size:12.5px;font-weight:550;letter-spacing:-.008em;padding-top:1px}
.a{padding-left:26px}
.a-t{font-size:12.5px;line-height:1.55;color:var(--ink-2);letter-spacing:-.005em}
.a-list{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column}
.a-list li{
  display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:12px;line-height:1.45;
}
.a-list li .li-l{min-width:0;flex:1}
.a-list li .li-r{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:7px}
.reflink{
  font-family:var(--mono);font-size:11px;color:var(--cobalt);border-bottom:1px solid var(--cobalt-100);
  letter-spacing:-.01em;
}
.reflink:hover{border-bottom-color:var(--cobalt);background:var(--cobalt-50)}
.a-foot{margin-top:9px;font-size:10.5px;color:var(--ink-4);display:flex;align-items:center;gap:5px}

/* ---------- command pill ---------- */
.cmd{position:fixed;right:20px;bottom:20px;z-index:38;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.cmd-pill{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 11px;border-radius:18px;
  background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);
  font-size:12.5px;color:var(--ink-3);transition:border-color .14s ease,color .14s ease;
}
.cmd-pill:hover{border-color:var(--cobalt);color:var(--ink-2)}
.cmd-pill svg{width:14px;height:14px;color:var(--cobalt)}
.cmd-panel{
  width:430px;max-width:calc(100vw - 40px);background:var(--surface);border:1px solid var(--line-2);
  border-radius:9px;box-shadow:var(--shadow-panel);overflow:hidden;display:none;
}
.cmd-panel.on{display:block;animation:rise .18s cubic-bezier(.32,.72,0,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cmd-in{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.cmd-in input{flex:1;border:0;outline:0;background:none;font-size:12.5px}
.cmd-in input::placeholder{color:var(--ink-4)}
.cmd-in svg{width:14px;height:14px;color:var(--cobalt);flex:0 0 14px}
.cmd-out{max-height:340px;overflow-y:auto;padding:11px 12px}
.cmd-sugg{display:flex;flex-direction:column;gap:1px}
.cmd-sugg button{
  text-align:left;padding:6px 8px;border-radius:4px;font-size:12px;color:var(--ink-2);width:100%;
  letter-spacing:-.005em;transition:background .1s ease;
}
.cmd-sugg button:hover{background:var(--cobalt-50);color:var(--cobalt-700)}
.cmd-foot{
  padding:8px 12px;border-top:1px solid var(--line);background:var(--surface-2);
  font-size:10.5px;color:var(--ink-4);display:flex;align-items:center;gap:6px;
}

/* ---------- demo bar ---------- */
.demobar{
  position:fixed;left:calc(var(--rail) + 20px);right:20px;bottom:20px;z-index:37;
  background:var(--ink);color:#fff;border-radius:8px;box-shadow:var(--shadow-panel);
  display:none;align-items:center;gap:13px;padding:11px 13px;max-width:none;
}
.demobar.on{display:flex;animation:rise .2s cubic-bezier(.32,.72,0,1)}
.demobar .step{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.2);border-radius:3px;padding:2px 6px;flex:0 0 auto;
}
.demobar .txt{font-size:12.5px;line-height:1.45;letter-spacing:-.005em;min-width:0;flex:1}
.demobar .txt b{font-weight:620;color:#fff}
.demobar .txt span{color:rgba(255,255,255,.66)}
.demobar .acts{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.demobar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:rgba(255,255,255,.9)}
.demobar .btn:hover{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.3)}
.demobar .btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.demobar .btn.primary:hover{background:#2E5CD6;border-color:#2E5CD6}
/* the guided demo owns the bottom strip: park the Ask pill and keep
   scrollable content clear of the bar */
body.demo-on .cmd{display:none}
body.demo-on .col-body{padding-bottom:84px}
body.demo-on .wrap{padding-bottom:96px}
body.demo-on .so-body{padding-bottom:86px}
body.demo-on .disp-side{padding-bottom:84px}
.demo-prog{position:absolute;left:0;bottom:0;height:2px;background:var(--cobalt);border-radius:0 2px 2px 0;transition:width .3s ease}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:20px;bottom:70px;z-index:45;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{
  width:334px;background:var(--surface);border:1px solid var(--line-2);border-left:2px solid var(--cobalt);
  border-radius:var(--r);box-shadow:var(--shadow-pop);padding:10px 12px;animation:rise .2s cubic-bezier(.32,.72,0,1);
}
.toast-h{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.toast-b{font-size:12px;line-height:1.45;color:var(--ink-2);letter-spacing:-.005em}
.toast-b b{font-weight:600;color:var(--ink)}
.toast-a{display:flex;gap:6px;margin-top:9px}
.toast-x{margin-left:auto;color:var(--ink-4);width:16px;height:16px;display:grid;place-items:center}
.toast-x:hover{color:var(--ink-2)}
.toast-x svg{width:11px;height:11px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
@media (max-width:1180px){
  .metrics{grid-template-columns:repeat(4,1fr)}
  .metric:nth-child(4){border-right:0}
  .metric:nth-child(-n+4){border-bottom:1px solid var(--line)}
  .ov-grid{grid-template-columns:minmax(0,1fr)}
  .brief-grid{grid-template-columns:minmax(0,1fr)}
  .disp{grid-template-columns:minmax(0,1fr)}
  .disp-side{display:none}
  /* the topbar gets tight before the rail does — the rail signature carries it */
  .tb-andar{display:none}
}
</style>
</head>

<div class="app">

<script>
"use strict";

/* =========================================================================
   Shipment Command Center — pitch prototype
   Fictional data. No network calls, no persistence, no integrations.
   ========================================================================= */

/* ---- demo clock -------------------------------------------------------
   Anchored to the next weekday at 11:05 so the board always reads as a
   live mid-morning on a working day, whenever the file is opened.        */
const CLOCK = (() => {
  const d = new Date();
  const dow = d.getDay();
  if (dow === 0) d.setDate(d.getDate() + 1);
  else if (dow === 6) d.setDate(d.getDate() + 2);
  d.setHours(11, 5, 0, 0);
  return d;
})();
const NOW = CLOCK.getTime();
const HOUR = 3600000, DAY = 86400000;

function at(dayOffset, h, m) {
  const d = new Date(CLOCK);
  d.setDate(d.getDate() + dayOffset);
  d.setHours(h, m, 0, 0);
  return d.getTime();
}
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOWFULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function fmtTime(ts){
  const d = new Date(ts); let h = d.getHours(); const m = d.getMinutes();
  const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return h + ":" + String(m).padStart(2,"0") + " " + ap;
}
function fmtDate(ts){ const d = new Date(ts); return DOW[d.getDay()] + " " + String(d.getDate()).padStart(2,"0") + " " + MON[d.getMonth()]; }
function fmtDT(ts){ return fmtDate(ts) + " · " + fmtTime(ts); }
function sameDay(a,b){ const x=new Date(a), y=new Date(b); return x.toDateString()===y.toDateString(); }
function dayDelta(ts){
  const a = new Date(ts); a.setHours(0,0,0,0);
  const b = new Date(NOW); b.setHours(0,0,0,0);
  return Math.round((a - b) / DAY);
}
function etaLabel(ts){
  const d = dayDelta(ts);
  if (d === 0) return "Today, " + fmtTime(ts);
  if (d === 1) return "Tomorrow, " + fmtTime(ts);
  if (d === -1) return "Yesterday, " + fmtTime(ts);
  if (d > 1 && d < 7) return DOW[new Date(ts).getDay()] + ", " + fmtTime(ts);
  return fmtDate(ts);
}
function etaShort(ts){
  const d = dayDelta(ts);
  if (d === 0) return "Today " + fmtTime(ts);
  if (d === 1) return "Tomorrow " + fmtTime(ts);
  if (d === -1) return "Yesterday";
  if (d > 1 && d < 7) return DOW[new Date(ts).getDay()] + " " + fmtTime(ts);
  return fmtDate(ts);
}
function ago(ts){
  const s = NOW - ts;
  if (s < 0) return "in " + ago(NOW - (ts - NOW)).replace(" ago","");
  const h = s / HOUR;
  if (h < 1) return Math.max(1, Math.round(s / 60000)) + "m";
  if (h < 24) return Math.round(h) + "h";
  const d = Math.floor(h / 24);
  return d + "d";
}
function agoWords(ts){
  const h = (NOW - ts) / HOUR;
  if (h < 1) return Math.max(1, Math.round((NOW - ts) / 60000)) + " minutes";
  if (h < 24) return Math.round(h) + " hours";
  const d = Math.floor(h / 24);
  return d === 1 ? "a day" : d + " days";
}
function dur(ms){
  const h = ms / HOUR;
  if (h < 1) return Math.max(1, Math.round(ms/60000)) + " min";
  if (h < 24) return Math.floor(h) + " hrs";
  const d = h / 24;
  return (d < 2 ? "1 day" : Math.round(d) + " days");
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(n){ return n.split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase(); }

/* ---- small builders ---- */
function D(type, status, ref, ts, note){ return { type, status, ref: ref || "", ts: ts || null, note: note || "" }; }
function T(ts, kind, text, who){ return { ts, kind, text, who: who || "" }; }
function M(ts, dir, channel, who, body, draft){ return { ts, dir, channel, who, body, draft: !!draft }; }

function seed(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function jit(key, span){ return seed(key) % span; }
function digits(key, n){ return String(seed(key) % Math.pow(10, n)).padStart(n, "0"); }

const DOC_NEED = {
  "Commercial Invoice":1, "Packing List":1, "Bill of Lading":1, "Air Waybill":1,
  "Certificate of Origin":2, "Import Permit":2, "Supporting Declarations":2,
  "Assessment / Payment Record":3, "Release Documents":5, "Delivery Confirmation":6
};
function docStatusFor(idx, need){
  if (idx > need + 1) return "approved";
  if (idx >= need) return "received";
  return "missing";
}
function docRef(sh, type){
  const k = sh.ref + type;
  switch(type){
    case "Commercial Invoice": return "INV-" + digits(k, 4);
    case "Packing List": return "PL-" + digits(k, 4);
    case "Bill of Lading": return sh.bl;
    case "Air Waybill": return sh.bl;
    case "Certificate of Origin": return (sh.origin === "CN" ? "FORM E " : "CO-") + digits(k, 6);
    case "Import Permit": return "IP-" + digits(k, 5);
    case "Supporting Declarations": return "SD-" + digits(k, 4);
    case "Assessment / Payment Record": return "SAD-" + digits(k, 6);
    case "Release Documents": return "RO-" + digits(k, 5);
    case "Delivery Confirmation": return "DR-" + digits(k, 4);
  }
  return "";
}
function buildDocs(sh){
  const idx = stageIndex(sh.stage);
  const transport = sh.mode === "air" ? "Air Waybill" : "Bill of Lading";
  const list = ["Commercial Invoice","Packing List",transport,"Certificate of Origin","Import Permit",
                "Supporting Declarations","Assessment / Payment Record","Release Documents","Delivery Confirmation"];
  return list.map(type => {
    if (type === "Import Permit" && !sh.permit) return D(type, "na", "", null, "Not applicable to this commodity");
    const st = docStatusFor(idx, DOC_NEED[type]);
    const span = Math.max(1, sh.stageSince - sh.created);
    const ts = st === "missing" ? null : sh.created + (jit(sh.ref + type, 89) / 100) * span;
    return D(type, st, st === "missing" ? "" : docRef(sh, type), ts ? Math.round(ts) : null, "");
  });
}

const STAGE_EVENTS = [
  { id:"new",      text:"Case created from client documents" },
  { id:"awaiting", text:"Document checklist generated, gaps identified" },
  { id:"prep",     text:"Entry preparation started" },
  { id:"filed",    text:"Entry lodged and assessment received" },
  { id:"payex",    text:"Moved to payment and examination handling" },
  { id:"release",  text:"Cleared for release, field task created" },
  { id:"delivery", text:"Released from port, delivery in progress" },
  { id:"closed",   text:"Case closed, documents archived" }
];
function buildTimeline(sh){
  const idx = stageIndex(sh.stage);
  const span = Math.max(HOUR, sh.stageSince - sh.created);
  const ev = [];
  for (let i = 0; i <= idx; i++){
    const ts = i === 0 ? sh.created
             : i === idx ? sh.stageSince
             : sh.created + (span * (i / Math.max(1, idx))) - jit(sh.ref + i, 5) * HOUR;
    ev.push(T(Math.round(ts), i === idx ? "stage" : (i === 0 ? "create" : "stage"), STAGE_EVENTS[i].text, sh.processor));
  }
  if (sh.lastUpdate) ev.push(T(sh.lastUpdate, "msg", "Status update sent to " + clientName(sh.clientId), sh.processor));
  return ev.sort((a,b) => a.ts - b.ts);
}
function buildComms(sh){
  const c = clientById(sh.clientId);
  const out = [];
  out.push(M(sh.created + jit(sh.ref+"c", 40) * 6 * 60000, "in", c.channel, c.contact,
    "Sending you the documents for this shipment. Please advise once the entry is ready to file."));
  if (sh.lastUpdate){
    out.push(M(sh.lastUpdate, "out", c.channel, staffName(sh.processor),
      "Update on " + sh.ref + ": the shipment is at " + stageName(sh.stage).toLowerCase() + ". " +
      (sh.blocker ? sh.blocker + " We will advise as soon as this clears." : "No action needed from your side at this time.")));
  }
  return out;
}

/* =========================================================================

   ========================================================================= */
const openShipments = () => state.shipments.filter(s => s.stage !== "closed");
const activeAsn = () => state.assignments.filter(a => a.status !== "done");

function arriving48(){
  return openShipments().filter(s => s.eta >= NOW && s.eta <= NOW + 48 * HOUR)
    .sort((a,b) => a.eta - b.eta);
}
function outstandingDocs(sh){
  const idx = stageIndex(sh.stage);
  return sh.docs.filter(d => {
    if (d.status === "discrepancy") return true;
    if (d.status !== "missing") return false;
    const need = DOC_NEED[d.type];
    if (d.type === "Supporting Declarations") return need <= idx;
    return need <= idx + 1;
  });
}
function docCount(){
  let docs = 0, cases = 0;
  openShipments().forEach(s => { const n = outstandingDocs(s).length; if (n){ docs += n; cases++; } });
  return { docs, cases };
}
const docBlocked = () => openShipments().filter(s => s.blockerType === "client-doc");
const awaitingClient = () => openShipments().filter(s => (s.blockerType || "").startsWith("client"));
const agingCases = () => openShipments().filter(s => NOW - s.stageSince > 36 * HOUR)
  .sort((a,b) => a.stageSince - b.stageSince);
const overdueAsn = () => activeAsn().filter(a => a.status !== "unassigned" && a.expected < NOW);
const unassignedAsn = () => state.assignments.filter(a => a.status === "unassigned");

function busyStaffIds(){
  const s = new Set();
  activeAsn().forEach(a => { if (a.staff) s.add(a.staff); });
  return s;
}
const availableStaff = () => { const b = busyStaffIds(); return STAFF.filter(s => !b.has(s.id)); };

function clientLastUpdate(clientId){
  const rows = state.shipments.filter(s => s.clientId === clientId && s.lastUpdate);
  if (!rows.length) return null;
  return Math.max.apply(null, rows.map(s => s.lastUpdate));
}
function staleClients(){
  return CLIENTS.filter(c => state.shipments.some(s => s.clientId === c.id && s.stage !== "closed"))
    .map(c => ({ client:c, last: clientLastUpdate(c.id) }))
    .filter(x => x.last && NOW - x.last > 48 * HOUR)
    .sort((a,b) => a.last - b.last);
}
function coLocated(){
  const byPort = {};
  activeAsn().forEach(a => {
    if (!a.staff) return;
    (byPort[a.portKey] = byPort[a.portKey] || []).push(a);
  });
  return Object.keys(byPort).filter(k => new Set(byPort[k].map(a => a.staff)).size > 1)
    .map(k => ({ portKey:k, place: byPort[k][0].place.split(" · ")[0], asns: byPort[k] }));
}

/* ---- ranked attention list ---- */
function buildAttention(){
  const items = [];
  openShipments().forEach(sh => {
    const disc = sh.docs.find(d => d.status === "discrepancy");
    if (disc) items.push({ sev:"crit", w:100,
      title: disc.type + " quantity differs from the " + (sh.mode === "air" ? "air waybill" : "bill of lading"),
      meta:[clientName(sh.clientId), "Arriving " + etaShort(sh.eta), staffName(sh.processor)], ref: sh.ref });
  });
  agingCases().forEach(sh => {
    if (!(sh.blockerType || "").startsWith("client")) return;
    items.push({ sev:"crit", w: 90 + Math.min(9, Math.round((NOW - sh.stageSince) / DAY)),
      title: sh.blocker, meta:[clientName(sh.clientId), "Waiting " + dur(NOW - sh.stageSince), stageName(sh.stage)], ref: sh.ref });
  });
  openShipments().forEach(sh => {
    if (sh.blockerType === "client-payment" && NOW - sh.stageSince <= 36 * HOUR)
      items.push({ sev:"crit", w:88, title: sh.blocker,
        meta:[clientName(sh.clientId), "Waiting " + dur(NOW - sh.stageSince)], ref: sh.ref });
  });
  overdueAsn().forEach(a => items.push({ sev:"warn", w:70,
    title:"Field assignment has passed its expected completion time",
    meta:[staffName(a.staff), a.place.split(" · ")[0], "Expected " + fmtTime(a.expected)], asn:a.id }));
  unassignedAsn().forEach(a => items.push({ sev:"warn", w:68,
    title:"Release pickup is not assigned to anyone",
    meta:[a.shipment, a.place.split(" · ")[0], "Scheduled " + fmtTime(a.scheduled)], asn:a.id }));
  openShipments().forEach(sh => {
    if (sh.blockerType === "client-doc" && !sh.docs.some(d => d.status === "discrepancy"))
      items.push({ sev:"warn", w:60, title: sh.blocker,
        meta:[clientName(sh.clientId), "Vessel due " + etaShort(sh.eta), "Waiting " + dur(NOW - sh.stageSince)], ref: sh.ref });
  });
  staleClients().forEach(x => items.push({ sev:"warn", w:55,
    title: x.client.name + " has had no update in " + agoWords(x.last),
    meta:["Last message " + fmtDT(x.last), x.client.contact], client: x.client.id }));
  openShipments().forEach(sh => {
    if (sh.blockerType === "cost") items.push({ sev:"info", w:40, title: sh.blocker,
      meta:[clientName(sh.clientId), sh.nextAction], ref: sh.ref });
  });
  const seen = new Set();
  return items.sort((a,b) => b.w - a.w).filter(it => {
    const k = (it.ref || it.asn || it.client || "") + "|" + it.title;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
}

/* ---- today's activity ---- */
function todayStart(){ const d = new Date(NOW); d.setHours(0,0,0,0); return d.getTime(); }
function buildActivity(){
  const t0 = todayStart(), out = [];
  state.shipments.forEach(sh => sh.timeline.forEach(ev => {
    if (ev.ts >= t0 && ev.ts <= NOW) out.push({ ts:ev.ts, kind:ev.kind, text:ev.text, who:ev.who, ref:sh.ref });
  }));
  state.assignments.forEach(a => {
    if (a.checkIn && a.checkIn >= t0) out.push({ ts:a.checkIn, kind:"dispatch",
      text: staffName(a.staff) + " checked in at " + a.place.split(" · ")[0], who:a.staff, asn:a.id });
    if (a.completed && a.completed >= t0) out.push({ ts:a.completed, kind:"ok",
      text: staffName(a.staff) + " completed " + a.task.toLowerCase(), who:a.staff, asn:a.id });
  });
  return out.sort((a,b) => b.ts - a.ts);
}

/* ---- morning briefing ---- */
function buildBriefing(){
  const lines = [];
  const arr = arriving48();
  if (arr.length) lines.push({
    text: word(arr.length) + " shipment" + (arr.length > 1 ? "s are" : " is") + " arriving within 48 hours",
    refs: arr.map(s => s.ref) });
  const db = docBlocked();
  if (db.length) lines.push({
    text: word(db.length) + " case" + (db.length > 1 ? "s remain" : " remains") + " blocked by missing client documents",
    refs: db.map(s => s.ref) });
  const un = unassignedAsn();
  if (un.length) lines.push({
    text: word(un.length) + " release assignment" + (un.length > 1 ? "s are" : " is") + " unassigned",
    asns: un.map(a => a.id) });
  coLocated().forEach(g => {
    const names = Array.from(new Set(g.asns.map(a => staffName(a.staff).split(" ")[0])));
    lines.push({ text: names.slice(0,-1).join(", ") + " and " + names[names.length-1] +
      " are both scheduled at " + g.place, asns: g.asns.map(a => a.id) });
  });
  staleClients().forEach(x => lines.push({
    text: "One client has not received an update in " + agoWords(x.last),
    client: x.client.id, clientName: x.client.name }));
  return lines;
}
function word(n){ return ["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"][n] || String(n); }

/* =========================================================================

   ========================================================================= */
function matchesFilters(s){
  const f = filters;
  if (f.staff && s.processor !== f.staff) return false;
  if (f.client && s.clientId !== f.client) return false;
  if (f.urg && s.urgency !== f.urg) return false;
  if (f.port && s.port !== f.port) return false;
  if (f.mode && s.mode !== f.mode) return false;
  if (f.q){
    const q = f.q.toLowerCase();
    const hay = [s.ref, clientName(s.clientId), s.bl, s.cargo, s.carrier, s.port, staffName(s.processor)].join(" ").toLowerCase();
    if (hay.indexOf(q) === -1) return false;
  }
  return true;
}
function viewShipments(){
  const shown = state.shipments.filter(matchesFilters);
  const anyFilter = filters.q || filters.staff || filters.client || filters.urg || filters.port || filters.mode;
  const opt = (val, cur, label) => '<option value="' + esc(val) + '"' + (cur === val ? " selected" : "") + '>' + esc(label) + '</option>';

  const bar = '<div class="filters">' +
    '<label class="search">' + I.search +
    '<input id="q" type="text" placeholder="Client, case reference, B/L, cargo…" value="' + esc(filters.q) + '" /></label>' +
    '<select class="sel' + (filters.staff ? " on" : "") + '" data-f="staff">' + opt("", filters.staff, "All staff") +
      STAFF.map(s => opt(s.id, filters.staff, s.name)).join("") + '</select>' +
    '<select class="sel' + (filters.client ? " on" : "") + '" data-f="client">' + opt("", filters.client, "All clients") +
      CLIENTS.map(c => opt(c.id, filters.client, c.name)).join("") + '</select>' +
    '<select class="sel' + (filters.urg ? " on" : "") + '" data-f="urg">' + opt("", filters.urg, "Any urgency") +
      opt("high", filters.urg, "High") + opt("med", filters.urg, "Medium") + opt("low", filters.urg, "Normal") + '</select>' +
    '<select class="sel' + (filters.port ? " on" : "") + '" data-f="port">' + opt("", filters.port, "All ports") +
      PORTS.map(p => opt(p, filters.port, p)).join("") + '</select>' +
    '<select class="sel' + (filters.mode ? " on" : "") + '" data-f="mode">' + opt("", filters.mode, "Sea and air") +
      opt("sea", filters.mode, "Sea") + opt("air", filters.mode, "Air") + '</select>' +
    (anyFilter ? '<button class="btn sm ghost" id="clearF">Clear</button>' : "") +
    '<span class="fcount">' + shown.length + ' of ' + state.shipments.length + ' cases</span></div>';

  const board = '<div class="board">' + STAGES.map(st => {
    const rows = shown.filter(s => s.stage === st.id);
    const i = stageIndex(st.id);
    const cbColor = st.id === "closed" ? "var(--green-mark)" : "rgba(23,72,196," + (0.16 + i * 0.12).toFixed(2) + ")";
    return '<div class="col" data-stage="' + st.id + '">' +
      '<div class="col-head"><span class="cb" style="background:' + cbColor + '"></span><span class="ct">' + esc(st.short) + '</span>' +
      '<span class="cc">' + rows.length + '</span></div>' +
      '<div class="col-body">' + (rows.length ? rows.map(cardEl).join("") :
        '<div class="col-empty">' + (anyFilter ? "No match" : "Nothing here") + '</div>') + '</div></div>';
  }).join("") + '</div>';

  return '<div style="display:flex;flex-direction:column;height:100%">' + bar +
    '<div style="flex:1;min-height:0">' + board + '</div></div>';
}
function cardEl(s){
  const waited = NOW - s.stageSince;
  const aging = waited > 36 * HOUR;
  const asn = state.assignments.find(a => a.shipment === s.ref && a.status !== "done");
  return '<div class="card u-' + s.urgency + '" data-ship="' + s.ref + '" data-card="' + s.ref + '">' +
    '<div class="card-top"><span class="card-ref mono">' + s.ref + '</span>' + modeEl(s.mode) + '</div>' +
    '<div class="card-client">' + esc(clientName(s.clientId)) + '</div>' +
    '<div class="card-cargo">' + esc(s.cargo) + ' · ' + esc(s.qty) + '</div>' +

      '</span><span class="mono" style="margin-left:auto">' + etaShort(s.eta) + '</span></div>' +
    (s.blocker ? '<div class="card-block' + (s.urgency === "high" ? "" : " warn") + '">' + I.alert +
      '<span>' + esc(s.blocker) + '</span></div>' : "") +
    (s.stage !== "closed" ? '<div class="card-next"><span class="arw">&rarr;</span><span>' + esc(s.nextAction) + '</span></div>' : "") +
    (asn ? '<div class="card-meta" style="border-top:0;padding-top:2px;margin-top:4px">' +

/* ---- moving a card ---- */
function moveShipment(ref, stage, silent){
  const s = shipByRef(ref);
  if (!s || s.stage === stage) return;
  const from = s.stage;
  s.stage = stage;
  s.stageSince = NOW;
  s.timeline.push(T(NOW, "stage", "Moved from " + stageName(from) + " to " + stageName(stage), s.processor));
  if (stage === "closed"){ s.blocker = ""; s.blockerType = ""; s.nextAction = "None. Case closed."; }
  render();
  if (!silent) suggestOnMove(s, from, stage);
}
function suggestOnMove(s, from, stage){
  if (stage === "release" && !state.assignments.some(a => a.shipment === s.ref && a.status !== "done")){
    const a = createReleaseTask(s);
    toast("Field task created", "<b>" + s.ref + "</b> reached For Release, so a release pickup was created at " +
      a.place.split(" · ")[0] + " and left unassigned for your approval.",
      [{ label:"Open dispatch", act:"view:dispatch" }, { label:"Recommend staff", act:"rec:" + a.id }]);
    return;
  }
  if (stage === "prep" && outstandingDocs(s).length){
    toast("Documents still outstanding", "<b>" + s.ref + "</b> moved to entry preparation with " +
      outstandingDocs(s).length + (outstandingDocs(s).length === 1 ? " document" : " documents") +
      " not yet on file. Filing now risks a mismatch.",
      [{ label:"Open case", act:"ship:" + s.ref }]);
    return;
  }
  if (stage === "delivery"){
    toast("Client update ready", "<b>" + s.ref + "</b> is out for delivery. A status update to " +
      clientName(s.clientId) + " has been drafted from the case record.",
      [{ label:"Review draft", act:"ship:" + s.ref }]);
    return;
  }
  toast("Stage updated", "<b>" + s.ref + "</b> moved to " + stageName(stage) + ". Next action and checklist were updated.",
    [{ label:"Open case", act:"ship:" + s.ref }]);
}
function createReleaseTask(s){
  const a = {
    id:"A-" + (3320 + state.assignments.length), staff:null,
    task:"Collect release order and gate pass", shipment:s.ref,
    place:s.port + (s.port.indexOf("Cebu International") === 0 ? " · Pier 4" : ""),
    portKey: portKeyFor(s.port), scheduled: NOW + 2 * HOUR, status:"unassigned",
    checkIn:null, checkNote:"", expected: NOW + 4 * HOUR,
    proof:"Release order and gate pass", next:"—", created:NOW
  };
  state.assignments.push(a);
  s.timeline.push(T(NOW, "dispatch", "Field task " + a.id + " created automatically for release pickup", ""));
  render();
  return a;
}
function portKeyFor(p){
  if (p.indexOf("Cebu International") === 0) return "CIP";
  if (p.indexOf("Cebu Container") === 0) return "CCT";
  if (p.indexOf("Cebu South") === 0) return "CSH";
  if (p.indexOf("Mactan-Cebu") === 0) return "MCIA";
  return "OTHER";
}

function parseQty(note){ const m = String(note).match(/(\d[\d,]*)/); return m ? parseInt(m[1].replace(/,/g, ""), 10) : null; }

function aiBox(s){
  const disc = s.docs.find(d => d.status === "discrepancy");
  const review = s.docs.find(d => d.status === "review");
  const transport = s.docs.find(d => d.type === "Bill of Lading" || d.type === "Air Waybill");

  if (review){
    return '<div class="ai-box"><div class="ai-box-h"><span class="ai-tag">' + I.spark + 'Automated check</span>' +
      '<span class="rt muted" style="margin-left:auto;font-size:11px">Queued</span></div>' +

      '<div class="ai-acts"><button class="btn sm primary" data-act="check:' + s.ref + '">Run consistency check</button></div></div>';
  }
  if (!disc) return "";
  const a = parseQty(disc.note), b = transport ? parseQty(transport.note) : null;
  const diff = (a !== null && b !== null) ? Math.abs(a - b) : null;
  return '<div class="ai-box crit"><div class="ai-box-h"><span class="ai-tag">' + I.spark + 'Automated check</span>' +
    '<span class="chip crit" style="margin-left:auto"><span class="sq"></span>Discrepancy</span></div>' +
    '<p>The ' + disc.type.toLowerCase() + ' ' + esc(disc.note.toLowerCase()) + '. The ' +
    (transport ? transport.type.toLowerCase() + ' ' + esc(transport.note.toLowerCase()) : "transport document differs") + '.' +
    (diff !== null ? ' That is a difference of ' + diff + ' cartons.' : "") + '</p>' +
    '<p>Filing on the current packing list would declare a quantity the transport document does not support, which is the kind of mismatch that gets picked up at examination.</p>' +
    '<div class="rec"><b>Recommended next step.</b> Request a corrected packing list from ' + esc(clientName(s.clientId)) +
    ' and hold entry preparation until the carton count agrees with the ' + (s.mode === "air" ? "air waybill" : "bill of lading") + '.</div>' +
    '<div class="ai-note">' + I.info + '<span>This is a document consistency check between the client\'s own files. It is not a customs classification, valuation, or regulatory determination.</span></div>' +
    '<div class="ai-acts"><button class="btn sm primary" data-act="draft:' + s.ref + '">Draft request to client</button>' +
    '<button class="btn sm" data-act="resolve:' + s.ref + '">Mark corrected copy received</button></div></div>';
}

function kvi(k, v){ return '<div class="kv-i"><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div></div>'; }

/* ---- case actions ---- */
function runCheck(ref){
  const s = shipByRef(ref);
  const pl = s.docs.find(d => d.status === "review");
  if (!pl) return;
  pl.status = "discrepancy";
  pl.note = "States 486 cartons";
  const tr = s.docs.find(d => d.type === "Bill of Lading" || d.type === "Air Waybill");
  tr.status = "approved";
  tr.note = tr.note || "States 468 cartons";
  s.timeline.push(T(NOW, "ai", "Consistency check run across invoice, packing list and " +
    (s.mode === "air" ? "air waybill" : "bill of lading")));
  s.timeline.push(T(NOW, "alert", "Carton quantity mismatch flagged. Case held before filing."));
  s.blocker = "Packing list quantity differs from bill of lading";
  s.blockerType = "client-doc";
  s.urgency = "high";
  s.nextAction = "Obtain corrected packing list, then start entry preparation";
  render();
}
function draftFor(ref, silent){
  const s = shipByRef(ref);
  const c = clientById(s.clientId);
  let body;
  if (s.docs.some(d => d.status === "discrepancy")){
    body = "Good morning " + c.contact.split(" ").slice(1).join(" ") + ". We are preparing the entry for your shipment " +
      s.ref + ", but we still require the corrected packing list. The carton quantity currently differs from the " +
      (s.mode === "air" ? "air waybill" : "bill of lading") + ". Please send the revised document so filing can proceed.";
  } else if (s.stage === "delivery"){
    const rel = s.docs.find(d => d.type === "Release Documents");
    body = "Good day " + c.contact.split(" ").slice(1).join(" ") + ". Your shipment " + s.ref + " (" + s.cargo.toLowerCase() +
      ") has been released from " + s.port + " and is now in transit for delivery. Release order " +
      (rel && rel.ref ? rel.ref : "on file") + " was collected on " + fmtDate(NOW) + ". We will send the signed delivery receipt once the consignee has received the cargo.";
  } else if (s.blocker){
    body = "Good day " + c.contact.split(" ").slice(1).join(" ") + ". Update on " + s.ref + ": " +
      s.blocker.charAt(0).toLowerCase() + s.blocker.slice(1) + ". " + s.nextAction + ".";
  } else {
    body = "Good day " + c.contact.split(" ").slice(1).join(" ") + ". Update on " + s.ref + ": the shipment is now at " +
      stageName(s.stage).toLowerCase() + ". " + s.nextAction + ". No action is needed from your side at this time.";
  }
  s.comms.push(M(NOW, "out", c.channel, staffName(s.processor), body, true));
  s.timeline.push(T(NOW, "ai", "Client update drafted from the case record, held for review", s.processor));
  render();
  if (!silent) toast("Draft prepared", "A message to <b>" + esc(clientName(s.clientId)) +
    "</b> was drafted from this case and recorded in the timeline. Nothing has been sent.",
    [{ label:"Review draft", act:"ship:" + s.ref }]);
}
function resolveDiscrepancy(ref, silent){
  const s = shipByRef(ref);
  const d = s.docs.find(x => x.status === "discrepancy");
  if (!d) return;
  d.status = "approved";
  d.ref = d.ref + "-R1";
  d.note = "Corrected copy, 468 cartons, agrees with the bill of lading";
  d.ts = NOW;
  s.blocker = "";
  s.blockerType = "";
  s.urgency = "med";
  s.nextAction = "Prepare and lodge the entry";
  s.timeline.push(T(NOW, "doc", "Corrected packing list received from " + clientName(s.clientId), s.processor));
  s.timeline.push(T(NOW, "ai", "Re-check passed. Carton count now agrees across all documents."));
  const c = clientById(s.clientId);
  s.comms.push(M(NOW - 12 * 60000, "in", c.channel, c.contact,
    "Hi Lena, here is the corrected packing list from our supplier. It should now read 468 cartons, same as the B/L."));
  moveShipment(ref, "prep", true);
  render();
  if (!silent) toast("Blocker cleared", "The corrected packing list agrees with the bill of lading. <b>" + s.ref +
    "</b> advanced to entry preparation.", [{ label:"Open case", act:"ship:" + s.ref }]);
}
function advance(ref){
  const s = shipByRef(ref);
  const i = stageIndex(s.stage);
  if (i >= STAGES.length - 1) return;
  moveShipment(ref, STAGES[i + 1].id);
}

/* =========================================================================
   Field Dispatch

function dispStatusLabel(a){
  const m = { unassigned:"Unassigned", scheduled:"Scheduled", enroute:"En route", onsite:"At location", blocked:"Waiting", done:"Completed" };
  return m[a.status] || a.status;
}
function dispChip(a){
  if (a.status === "done") return chip("ok", "Completed");
  if (a.status === "blocked") return chip("crit", "Waiting");
  if (a.status === "unassigned") return chip("warn", "Unassigned");
  if (a.status === "onsite") return chip("info", "At location");
  return chip("flat", dispStatusLabel(a));
}
function viewDispatch(){
  const board = '<div class="board">' + DISPATCH_STAGES.map(st => {
    const rows = state.assignments.filter(a => a.status === st.id);
    return '<div class="col" style="flex:0 0 250px;width:250px"><div class="col-head">' +
      '<span class="cb"></span><span class="ct">' + esc(st.name) + '</span><span class="cc">' + rows.length + '</span></div>' +
      '<div class="col-body">' + (rows.length ? rows.map(asnCard).join("") :
        '<div class="col-empty">Nothing here</div>') + '</div></div>';

    a.shipment + " automatically.", [{ label:"Open case", act:"ship:" + a.shipment }]);

let docFilter = "outstanding";
function viewDocuments(){
  const open = openShipments();
  const readiness = open.map(s => {
    const app = s.docs.filter(d => d.status !== "na");
    const ok = app.filter(d => d.status === "approved" || d.status === "received").length;
    return { s, ok, tot: app.length, pct: Math.round(ok / app.length * 100), out: outstandingDocs(s) };
  }).sort((a,b) => a.pct - b.pct);

  const rows = [];
  open.forEach(s => s.docs.forEach(d => {
    if (d.status === "na") return;
    const isOut = outstandingDocs(s).indexOf(d) !== -1;
    if (docFilter === "outstanding" && !isOut) return;
    if (docFilter === "discrepancy" && d.status !== "discrepancy") return;
    rows.push({ s, d, isOut });
  }));
  rows.sort((a,b) => {
    const w = { discrepancy:0, review:1, missing:2, received:3, approved:4 };
    return (w[a.d.status] - w[b.d.status]) || (a.s.eta - b.s.eta);
  });

  const summary = '<div class="metrics" style="grid-template-columns:repeat(4,1fr)">' +
    metric(open.reduce((n, s) => n + s.docs.filter(d => d.status === "discrepancy").length, 0), "Discrepancies found", "Flagged by automated check", "crit") +
    metric(docCount().docs, "Documents outstanding", "In " + docCount().cases + " open cases", "warn") +
    metric(open.filter(s => (s.blockerType || "").startsWith("client")).length, "Waiting on the client", "Document, payment or instruction", "warn") +
    metric(readiness.filter(r => r.pct === 100).length, "Complete checklists", "Ready to progress", "") +
    '</div>';

  const rd = '<section class="panel" style="margin-top:16px"><div class="panel-head"><h3>Checklist readiness by case</h3>' +
    '<span class="rt">Lowest first</span></div><div class="tblwrap" style="border:0;border-radius:0">' +
    '<table class="t"><thead><tr><th>Case</th><th>Client</th><th>Stage</th><th>ETA</th>' +
    '<th>Readiness</th><th>Outstanding</th></tr></thead><tbody>' +
    readiness.map(r => '<tr data-ship="' + r.s.ref + '">' +
      '<td class="mono" style="color:var(--cobalt)">' + r.s.ref + '</td>' +
      '<td>' + esc(clientName(r.s.clientId)) + '</td>' +
      '<td class="muted">' + esc(stageName(r.s.stage)) + '</td>' +
      '<td class="mono" style="font-size:11.5px">' + etaShort(r.s.eta) + '</td>' +
      '<td><span class="readiness"><span class="bar-track"><span class="bar-fill ' +
        (r.pct === 100 ? "ok" : r.pct >= 60 ? "" : r.pct >= 35 ? "warn" : "crit") + '" style="width:' + r.pct + '%"></span></span>' +
        '<span class="mono muted" style="font-size:11px">' + r.ok + '/' + r.tot + '</span></span></td>' +
      '<td>' + (r.out.length ? r.out.map(d => docChip(d.status)).slice(0,2).join(" ") +
        (r.out.length > 2 ? ' <span class="muted" style="font-size:11px">+' + (r.out.length - 2) + '</span>' : "") :
        '<span class="muted" style="font-size:11.5px">None</span>') + '</td></tr>').join("") +
    '</tbody></table></div></section>';

  const tbl = '<section class="panel" style="margin-top:16px"><div class="panel-head"><h3>Document register</h3>' +
    '<div style="margin-left:auto;display:flex;gap:6px">' +
    ["outstanding","discrepancy","all"].map(f => '<button class="btn sm' + (docFilter === f ? " primary" : "") +
      '" data-docf="' + f + '">' + (f === "outstanding" ? "Outstanding" : f === "discrepancy" ? "Discrepancies" : "All documents") +
      '</button>').join("") + '</div></div>' +
    '<div class="tblwrap" style="border:0;border-radius:0"><table class="t"><thead><tr>' +
    '<th>Document</th><th>Case</th><th>Client</th><th>Reference</th><th>Received</th><th>Needed by</th><th>Status</th>' +
    '</tr></thead><tbody>' + (rows.length ? rows.map(r => '<tr data-ship="' + r.s.ref + '">' +
      '<td>' + esc(r.d.type) + (r.d.note ? '<div class="muted" style="font-size:11px;margin-top:2px">' + esc(r.d.note) + '</div>' : "") + '</td>' +
      '<td class="mono" style="color:var(--cobalt)">' + r.s.ref + '</td>' +
      '<td>' + esc(clientName(r.s.clientId)) + '</td>' +
      '<td class="mono" style="font-size:11.5px">' + (r.d.ref ? esc(r.d.ref) : '<span class="muted">—</span>') + '</td>' +
      '<td class="mono" style="font-size:11.5px">' + (r.d.ts ? fmtDate(r.d.ts) : '<span class="muted">—</span>') + '</td>' +
      '<td class="muted" style="font-size:11.5px">' + esc(STAGES[DOC_NEED[r.d.type]].name) + '</td>' +
      '<td>' + docChip(r.d.status) + '</td></tr>').join("") :
      '<tr><td colspan="7" class="muted" style="text-align:center;padding:22px">Nothing outstanding.</td></tr>') +
    '</tbody></table></div></section>';

  return '<div class="wrap">' + summary + rd + tbl + '</div>';
}

function renderThread(){

  el.innerHTML = thread.length ? thread.map(t =>
    '<div><div class="q"><span class="qi">?</span><span class="qt">' + esc(t.q) + '</span></div>' +

function renderAnswer(a){
