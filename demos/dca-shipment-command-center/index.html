    (a.list && a.list.length ? '<ul class="a-list">' + a.list.map(x =>
      '<li><span class="li-l">' + x.l + '</span><span class="li-r">' + (x.r || "") + '</span></li>').join("") + '</ul>' : "") +
    (a.foot ? '<div class="a-foot">' + I.info + '<span>' + a.foot + '</span></div>' : "");
}

/* ---- question answering ---- */
function ask(q){
  const a = answer(q);
  thread.push({ q, a });
  if (view === "briefing") renderThread();
  return a;
}
function norm(s){ return s.toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim(); }

function answer(qRaw){
  const q = norm(qRaw);

  // where is <staff>
  const who = STAFF.find(s => q.indexOf(norm(s.name.split(" ")[0])) !== -1);
  if (who && /where|assigned|located|doing|today/.test(q) && !/available|free/.test(q)) return ansWhere(who);

  // what did we last tell <client>
  const cl = CLIENTS.find(c => q.indexOf(norm(c.name.split(" ")[0])) !== -1);
  if (cl && /tell|told|say|said|send|sent|update|hear|communicat/.test(q)) return ansClient(cl);

  const rules = [
    { f: ansArriving,  kw:["arriv","this week","eta","coming","due","incoming","vessel","berth","discharg"] },
    { f: ansBlocked,   kw:["blocked","blocker","waiting on client","client","stuck","hold","pending","held up"] },
    { f: ansLongest,   kw:["longest","oldest","aging","stale","waiting longest","slow","sitting","delayed"] },
    { f: ansDocs,      kw:["document","missing","paperwork","checklist","incomplete","invoice","packing list","permit","origin"] },
    { f: ansAvailable, kw:["available","free","who can","spare","capacity","idle","unassigned staff"] },
    { f: ansTrips,     kw:["trip","combine","same port","together","route","consolidat","one trip"] },
    { f: ansRisks,     kw:["risk","summar","priorit","attention","brief","urgent","problem","wrong","worry","escalat","fire","emergency"] }
  ];
  let best = null, bestScore = 0;
  rules.forEach(r => {
    let sc = 0;
    r.kw.forEach(k => { if (q.indexOf(k) !== -1) sc += k.length > 6 ? 3 : 2; });
    if (sc > bestScore){ bestScore = sc; best = r; }
  });
  if (best && bestScore >= 2) return best.f();
  if (cl) return ansClient(cl);
  if (who) return ansWhere(who);
  return {
    text: "This prototype answers from the records on this board. Try one of these:",
    list: QUESTIONS.map(x => ({ l:'<button class="reflink" data-q="' + esc(x) + '" style="font-family:var(--sans);font-size:12px">' + esc(x) + '</button>' })),
    foot: "A production system would read your real case files. Nothing here is connected to live data."
  };
}
function ansArriving(){
  const rows = openShipments().filter(s => s.eta >= NOW - 6 * HOUR && s.eta <= NOW + 7 * DAY).sort((a,b) => a.eta - b.eta);
  return {
    text: rows.length + " shipments arrive in the next seven days. " +
      arriving48().length + " of them land within 48 hours, and " +
      rows.filter(s => outstandingDocs(s).length).length + " still have documents outstanding.",
    list: rows.map(s => ({
      l: refLink(s.ref) + " &nbsp;" + esc(clientName(s.clientId)) + ' <span class="muted">· ' + esc(s.port.split(",")[0]) + '</span>',
      r: (outstandingDocs(s).length ? chip("crit", outstandingDocs(s).length + " doc") + " " : "") +
         '<span class="mono muted" style="font-size:11px">' + etaShort(s.eta) + '</span>'
    })),
    foot: "Sorted by arrival. Cases already at the port are not listed here."
  };
}
function ansBlocked(){
  const rows = awaitingClient();
  return {
    text: rows.length + " cases are waiting on something the client has to do. " +
      docBlocked().length + " are blocked by documents, the rest by payment or a decision.",
    list: rows.map(s => ({
      l: refLink(s.ref) + " &nbsp;" + esc(clientName(s.clientId)) + '<div class="muted" style="margin-top:2px">' + esc(s.blocker) + '</div>',
      r: chip(s.urgency === "high" ? "crit" : "warn", dur(NOW - s.stageSince))
    })),
    foot: "Waiting time is measured from when the case entered its current stage."
  };
}
const WHERE_VERB = { onsite:"on site at", enroute:"on the way to", scheduled:"scheduled at", blocked:"waiting at", unassigned:"not yet assigned to" };
function ansWhere(st){
  const rows = state.assignments.filter(a => a.staff === st.id &&
    ((a.scheduled >= todayStart()) || (a.completed && a.completed >= todayStart())));
  if (!rows.length) return {
    text: st.name + " has no field assignment today and is working from the office.",
    list: [], foot: "Availability is derived from assignments, not from location tracking."
  };
  const cur = rows.find(a => a.status !== "done");
  return {
    text: cur ? st.name + " is " + WHERE_VERB[cur.status] + " " + cur.place.split(" · ")[0] +
        " for " + cur.shipment + (cur.checkIn ? ", last check-in " + fmtTime(cur.checkIn) : "") +
        ". Expected to finish around " + fmtTime(cur.expected) + "." :
      st.name + " has finished today's assignments.",
    list: rows.map(a => ({
      l: '<button class="reflink" data-asn="' + a.id + '">' + a.id + '</button> &nbsp;' + esc(a.task) +
         '<div class="muted" style="margin-top:2px">' + esc(a.place) + '</div>',
      r: dispChip(a) + ' <span class="mono muted" style="font-size:11px">' + fmtTime(a.scheduled) + '</span>'
    })),
    foot: "Location comes from the assignment and the staff member's own check-in."
  };
}
function ansLongest(){
  const rows = openShipments().slice().sort((a,b) => a.stageSince - b.stageSince).slice(0, 6);
  return {
    text: "The longest wait is " + refLink(rows[0].ref) + " at " + dur(NOW - rows[0].stageSince) +
      " in " + stageName(rows[0].stage).toLowerCase() + ". " + agingCases().length +
      " cases have been in the same stage for more than 36 hours.",
    list: rows.map(s => ({
      l: refLink(s.ref) + " &nbsp;" + esc(clientName(s.clientId)) +
         '<div class="muted" style="margin-top:2px">' + esc(s.blocker || s.nextAction) + '</div>',
      r: chip(NOW - s.stageSince > 48 * HOUR ? "crit" : "warn", dur(NOW - s.stageSince))
    })),
    foot: "Measured from the last stage change on each case."
  };
}
function ansDocs(){
  const rows = [];
  openShipments().forEach(s => outstandingDocs(s).forEach(d => rows.push({ s, d })));
  rows.sort((a,b) => (a.d.status === "discrepancy" ? -1 : 0) - (b.d.status === "discrepancy" ? -1 : 0) || a.s.eta - b.s.eta);
  const dc = docCount();
  return {
    text: dc.docs + " documents are outstanding across " + dc.cases + " open cases. " +
      rows.filter(r => r.d.status === "discrepancy").length + " of them is a discrepancy rather than a gap, which is the more urgent kind.",
    list: rows.slice(0, 9).map(r => ({
      l: esc(r.d.type) + " &nbsp;" + refLink(r.s.ref) + '<div class="muted" style="margin-top:2px">' +
         esc(clientName(r.s.clientId)) + " · ETA " + etaShort(r.s.eta) + '</div>',
      r: docChip(r.d.status)
    })),
    foot: rows.length > 9 ? "Showing the 9 most time-critical of " + rows.length + "." : "Ordered by arrival date."
  };
}
function ansAvailable(){
  const free = availableStaff();
  const soon = activeAsn().filter(a => a.staff && a.expected > NOW).sort((a,b) => a.expected - b.expected);
  return {
    text: free.length ? free.map(s => s.name).join(" and ") + " " + (free.length > 1 ? "have" : "has") +
        " no field assignment today. The next field representative to free up is " +
        (soon.length ? staffName(soon[0].staff) + " around " + fmtTime(soon[0].expected) : "not scheduled") + "." :
      "Everyone is committed. The first opening is " + (soon.length ? fmtTime(soon[0].expected) : "tomorrow") + ".",
    list: STAFF.map(s => {
      const a = activeAsn().find(x => x.staff === s.id);
      return {
        l: esc(s.name) + ' <span class="muted">· ' + esc(s.role) + '</span>' +
           (a ? '<div class="muted" style="margin-top:2px">' + esc(a.task) + " · " + esc(a.place.split(" · ")[0]) + '</div>' : ""),
        r: a ? chip("flat", "Free " + fmtTime(a.expected)) : chip("ok", "Available")
      };
    }),
    foot: "Documentation staff are office-based and are not dispatched to the ports."
  };
}
function ansTrips(){
  const groups = coLocated();
  const un = unassignedAsn();
  const combos = [];
  un.forEach(u => {
    const near = activeAsn().find(a => a.staff && a.portKey === u.portKey && a.id !== u.id);
    if (near) combos.push({ u, near });
  });
  return {
    text: combos.length ? combos.length + " unassigned task" + (combos.length > 1 ? "s" : "") +
        " can ride along with a trip that is already happening. " +
        (groups.length ? groups.length + " location also has more than one person scheduled." : "") :
      "No unassigned task overlaps with a trip already scheduled today.",
    list: combos.map(c => ({
      l: '<button class="reflink" data-asn="' + c.u.id + '">' + c.u.id + '</button> &nbsp;' + esc(c.u.task) +
         '<div class="muted" style="margin-top:2px">' + esc(staffName(c.near.staff)) + " is at " +
         esc(c.u.place.split(" · ")[0]) + " until " + fmtTime(c.near.expected) + " for " + c.near.shipment + '</div>',
      r: '<button class="btn sm primary" data-act="assign:' + c.u.id + ':' + c.near.staff + '">Assign ' +
         esc(staffName(c.near.staff).split(" ")[0]) + '</button>'
    })).concat(groups.map(g => ({
      l: '<span>' + esc(g.place) + '</span><div class="muted" style="margin-top:2px">' +
         g.asns.map(a => esc(staffName(a.staff)) + " · " + esc(a.shipment)).join(" and ") + '</div>',
      r: chip("info", g.asns.length + " trips")
    }))),
    foot: "Grouping is a suggestion. The manager decides who actually goes."
  };
}
function ansClient(c){
  const rows = state.shipments.filter(s => s.clientId === c.id);
  const msgs = [];
  rows.forEach(s => s.comms.forEach(m => { if (m.dir === "out") msgs.push({ m, s }); }));
  msgs.sort((a,b) => b.m.ts - a.m.ts);
  const last = msgs[0];
  const drafts = msgs.filter(x => x.m.draft);
  return {
    text: last ? "The last message to " + esc(c.name) + " went out " + fmtDT(last.m.ts) + " on " + refLink(last.s.ref) +
        (last.m.draft ? " and is still a draft, not sent." : ".") +
        (drafts.length ? " There " + (drafts.length > 1 ? "are " + drafts.length + " drafts" : "is 1 draft") + " waiting for review." : "") :
      "Nothing has been sent to " + esc(c.name) + " from this board.",
    list: (last ? [{ l: '<div style="color:var(--ink-2);line-height:1.5">' + esc(last.m.body) + '</div>' +
        '<div class="muted" style="margin-top:5px">' + esc(last.m.who) + " · " + (last.m.channel === "viber" ? "Viber" : "Email") + '</div>',
      r: last.m.draft ? chip("info", "Draft") : chip("ok", "Sent") }] : [])
      .concat(rows.filter(s => s.stage !== "closed").map(s => ({
        l: refLink(s.ref) + " &nbsp;" + esc(s.cargo) + '<div class="muted" style="margin-top:2px">' +
           esc(stageName(s.stage)) + (s.blocker ? " · " + esc(s.blocker) : "") + '</div>',
        r: '<span class="mono muted" style="font-size:11px">' + etaShort(s.eta) + '</span>'
      }))),
    foot: "Drafts are held for review. This prototype does not send anything."
  };
}
function ansRisks(){
  const att = buildAttention();
  const crit = att.filter(a => a.sev === "crit");
  return {
    text: crit.length + " things could cost money or time today, and " + att.filter(a => a.sev === "warn").length +
      " are worth watching. The sharpest is " + esc(crit.length ? crit[0].title.toLowerCase() : "nothing outstanding") +
      (crit.length && crit[0].ref ? " on " + refLink(crit[0].ref) : "") + ".",
    list: att.slice(0, 6).map(a => ({
      l: esc(a.title) + '<div class="muted" style="margin-top:2px">' + a.meta.map(esc).join(" · ") + '</div>',
      r: (a.ref ? refLink(a.ref) : a.asn ? '<button class="reflink" data-asn="' + a.asn + '">' + a.asn + '</button>' : "") +
         " " + chip(a.sev === "crit" ? "crit" : a.sev === "warn" ? "warn" : "info",
           a.sev === "crit" ? "Critical" : a.sev === "warn" ? "Watch" : "Note")
    })),
    foot: "Ranked by consequence, not by how loud the case is."
  };
}

/* =========================================================================
   Command pill
   ========================================================================= */
let cmdOpen = false;
function toggleCmd(force){
  cmdOpen = force !== undefined ? force : !cmdOpen;
  document.getElementById("cmdPanel").classList.toggle("on", cmdOpen);
  if (cmdOpen){ renderCmd(); setTimeout(() => document.getElementById("cmdInput").focus(), 20); }
}
let cmdAnswer = null;
function renderCmd(){
  document.getElementById("cmdOut").innerHTML = cmdAnswer ?
    '<div class="q" style="margin-bottom:9px"><span class="qi">?</span><span class="qt">' + esc(cmdAnswer.q) + '</span></div>' +
    '<div class="a" style="padding-left:0">' + renderAnswer(cmdAnswer.a) + '</div>' +
    '<div style="margin-top:11px"><button class="btn sm" data-view="briefing">Open full briefing ' + I.chev + '</button></div>' :
    '<div class="lbl" style="margin-bottom:7px">Try asking</div><div class="cmd-sugg">' +
    QUESTIONS.map(q => '<button data-q="' + esc(q) + '">' + esc(q) + '</button>').join("") + '</div>';
}
function runCmd(q){
  if (!q.trim()) return;
  cmdAnswer = { q, a: ask(q) };
  renderCmd();
}

/* =========================================================================
   Toasts
   ========================================================================= */
let toastSilent = false;
function toast(title, body, actions){
  if (toastSilent) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = '<div class="toast-h"><span class="ai-tag">' + I.spark + 'Suggestion</span>' +
    '<span style="font-size:12px;font-weight:620;letter-spacing:-.01em">' + esc(title) + '</span>' +
    '<button class="toast-x" data-act="dismiss">' + I.x + '</button></div>' +
    '<div class="toast-b">' + body + '</div>' +
    (actions && actions.length ? '<div class="toast-a">' + actions.map((a, i) =>
      '<button class="btn sm' + (i === 0 ? " primary" : "") + '" data-act="' + a.act + '">' + esc(a.label) + '</button>').join("") + '</div>' : "");
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 14000);
}
function clearToasts(){ document.getElementById("toasts").innerHTML = ""; }

/* =========================================================================
   Guided demo — the connected Harborline scenario
   ========================================================================= */
const HERO = "HBS-2026-018";
const DEMO = [
  { t:"A container arrives tomorrow", s:"Cebu International Port, 6:30 AM. Documents came in yesterday afternoon and the case is sitting in Awaiting Documents.",
    run(){
      const s = shipByRef(HERO);
      s.stage = "awaiting"; s.stageSince = at(-1,15,20); s.urgency = "med";
      s.blocker = "Documents received, verification not yet run"; s.blockerType = "";
      s.nextAction = "Verify the document set before entry preparation";
      s.lastUpdate = null;
      s.docs.find(d => d.type === "Packing List").status = "review";
      s.docs.find(d => d.type === "Packing List").note = "Uploaded by client, not yet verified";
      s.docs.find(d => d.type === "Bill of Lading").status = "received";
      s.timeline = s.timeline.filter(e => e.ts <= at(-1,10,40));
      s.comms = s.comms.filter(m => m.ts <= at(-2,14,20));
      state.assignments = state.assignments.filter(a => a.shipment !== HERO);
      go("shipments"); flashCard(HERO);
    }},
  { t:"Everything arrived, nothing was cross-checked", s:"Invoice, packing list, bill of lading and Form E are all on file. Today that comparison is somebody reading two PDFs side by side.",
    run(){ go("shipments"); openShip(HERO); }},
  { t:"Flagged, and the case is held", s:"The packing list says 486 cartons, the bill of lading says 468. The case is blocked before anything is filed, and the reason is written down.",
    run(){ runCheck(HERO); go("shipments"); openShip(HERO); }},
  { t:"A request to the client is drafted", s:"Written from the case record, addressed to the right contact, held as a draft. Nothing is sent automatically.",
    run(){ draftFor(HERO, true); openShip(HERO); }},
  { t:"The client sends a corrected packing list", s:"468 cartons, matching the bill of lading. The re-check passes, the blocker clears, and the case advances to entry preparation.",
    run(){ resolveDiscrepancy(HERO, true); openShip(HERO); }},
  { t:"Filed, assessed, and cleared for release", s:"Reaching For Release creates the field task automatically, and leaves it unassigned for the manager.",
    run(){
      moveShipment(HERO, "filed", true);
      moveShipment(HERO, "payex", true);
      moveShipment(HERO, "release", true);
      const s = shipByRef(HERO);
      s.nextAction = "Collect the release order at Cebu International Port";
      if (!state.assignments.some(a => a.shipment === HERO)) createReleaseTask(s);
      closePanel(); go("shipments"); flashCard(HERO);
    }},
  { t:"Someone is already going there", s:"Marco is at Cebu International Port until about 12:15 PM for the Northshore examination. The second task is at the same port.",
    run(){ go("dispatch"); const a = state.assignments.find(x => x.shipment === HERO); if (a) flashAsn(a.id); }},
  { t:"The trip is combined", s:"One person, one trip, two tasks. The manager approves the suggestion rather than the system deciding on its own.",
    run(){ const a = state.assignments.find(x => x.shipment === HERO && x.status === "unassigned");
      if (a) assignTo(a.id, "marco", true); go("dispatch"); }},
  { t:"Marco checks in and uploads the release order", s:"The document lands on the case by itself. No one has to remember to forward it.",
    run(){ const a = state.assignments.find(x => x.shipment === HERO); if (a) completeAsn(a.id, true); go("dispatch"); }},
  { t:"The shipment moves to delivery", s:"Completing the field task advances the case. The board reflects what happened at the port, not what someone remembered to type.",
    run(){ moveShipment(HERO, "delivery", true); go("shipments"); openShip(HERO); }},
  { t:"A client update is drafted from the record", s:"It quotes the release order that was actually uploaded, so the update matches what happened.",
    run(){ draftFor(HERO, true); go("shipments"); openShip(HERO); }},
  { t:"The manager sees all of it without asking anyone", s:"Stage, blocker, owner, next action, field assignment and the latest client message, on one board.",
    run(){ closePanel(); go("overview"); }}
];
let demoStep = -1;
function startDemo(){ gotoStep(0); }
function gotoStep(n){
  if (n < 0 || n >= DEMO.length) return;
  clearToasts();
  toastSilent = true;
  state = JSON.parse(INITIAL);
  closePanel();
  for (let i = 0; i <= n; i++) DEMO[i].run();
  toastSilent = false;
  demoStep = n;
  render();
  renderDemoBar();
}
function endDemo(){
  demoStep = -1;
  document.getElementById("demobar").classList.remove("on");
  document.body.classList.remove("demo-on");
  clearToasts();
}
function renderDemoBar(){
  const bar = document.getElementById("demobar");
  document.body.classList.toggle("demo-on", demoStep >= 0);
  if (demoStep < 0){ bar.classList.remove("on"); return; }
  const d = DEMO[demoStep];
  bar.classList.add("on");
  if (cmdOpen) toggleCmd(false);
  bar.innerHTML = '<span class="step">' + (demoStep + 1) + ' / ' + DEMO.length + '</span>' +
    '<span class="txt"><b>' + esc(d.t) + '</b> &nbsp;<span>' + esc(d.s) + '</span></span>' +
    '<span class="acts">' +
      '<button class="btn sm" data-demo="prev"' + (demoStep === 0 ? " disabled" : "") + '>Back</button>' +
      (demoStep === DEMO.length - 1 ?
        '<button class="btn sm" data-demo="end">Finish</button>' :
        '<button class="btn sm primary" data-demo="next">Next</button>') +
      '<button class="btn sm" data-demo="end">Exit</button>' +
    '</span><span class="demo-prog" style="width:' + ((demoStep + 1) / DEMO.length * 100) + '%"></span>';
}
function flashCard(ref){
  setTimeout(() => {
    const el = document.querySelector('[data-card="' + ref + '"]');
    if (el){ el.classList.add("flash"); el.scrollIntoView({ block:"nearest", inline:"center", behavior:"smooth" }); }
  }, 40);
}
function flashAsn(id){
  setTimeout(() => {
    const el = document.querySelector('[data-acard="' + id + '"]');
    if (el){ el.classList.add("flash"); el.scrollIntoView({ block:"nearest", inline:"center", behavior:"smooth" }); }
  }, 40);
}

/* =========================================================================
   Events
   ========================================================================= */
document.addEventListener("click", e => {
  if (suppressClick) return;
  const t = e.target;

  const dismiss = t.closest('[data-act="dismiss"]');
  if (dismiss){ const tt = dismiss.closest(".toast"); if (tt) tt.remove(); return; }

  const act = t.closest("[data-act]");
  if (act){
    const [kind, arg, arg2] = act.getAttribute("data-act").split(":");
    const tt = act.closest(".toast");
    if (kind === "close") return closePanel();
    if (kind === "check") runCheck(arg);
    if (kind === "draft") draftFor(arg);
    if (kind === "resolve") resolveDiscrepancy(arg);
    if (kind === "advance") advance(arg);
    if (kind === "rec") recommendFor(arg);
    if (kind === "assign"){ assignTo(arg, arg2); if (tt) tt.remove(); }
    if (kind === "copy"){ act.textContent = "Copied"; setTimeout(() => { act.textContent = "Copy draft"; }, 1400); }
    if (kind === "ship") openShip(arg);
    if (kind === "view"){ go(arg); if (tt) tt.remove(); }
    if (openRef && kind !== "close") renderPanel();
    return;
  }

  const dq = t.closest("[data-q]");
  if (dq){
    const q = dq.getAttribute("data-q");
    if (dq.closest("#cmdOut") || dq.closest(".cmd-panel")) runCmd(q);
    else { ask(q); if (view !== "briefing") go("briefing"); }
    return;
  }

  const nav = t.closest("[data-view]");
  if (nav){ go(nav.getAttribute("data-view")); return; }

  const jump = t.closest("[data-jump]");
  if (jump){ go(jump.getAttribute("data-jump")); return; }

  const ship = t.closest("[data-ship]");
  if (ship){ openShip(ship.getAttribute("data-ship")); return; }

  const asn = t.closest("[data-asn]");
  if (asn){ closePanel(); go("dispatch"); flashAsn(asn.getAttribute("data-asn")); return; }

  const client = t.closest("[data-client]");
  if (client){
    const c = clientById(client.getAttribute("data-client"));
    ask("What did we last tell " + c.name.split(" ")[0] + "?");
    go("briefing");
    return;
  }

  const staff = t.closest("[data-staff]");
  if (staff){
    const s = staffById(staff.getAttribute("data-staff"));
    ask("Where is " + s.name.split(" ")[0] + " assigned today?");
    go("briefing");
    return;
  }

  const df = t.closest("[data-docf]");
  if (df){ docFilter = df.getAttribute("data-docf"); render(); return; }

  const dm = t.closest("[data-demo]");
  if (dm){
    const a = dm.getAttribute("data-demo");
    if (a === "next") gotoStep(demoStep + 1);
    if (a === "prev") gotoStep(demoStep - 1);
    if (a === "end") endDemo();
    return;
  }
});

document.getElementById("scrim").addEventListener("click", closePanel);
document.getElementById("demoBtn").addEventListener("click", startDemo);
document.getElementById("resetBtn").addEventListener("click", () => {
  state = JSON.parse(INITIAL);
  filters = { q:"", staff:"", client:"", urg:"", port:"", mode:"" };
  thread = []; cmdAnswer = null; docFilter = "outstanding";
  closePanel(); endDemo(); clearToasts(); go("overview");
});
document.getElementById("cmdPill").addEventListener("click", () => toggleCmd());

document.addEventListener("input", e => {
  if (e.target.id === "q"){ filters.q = e.target.value; const p = e.target.selectionStart; render();
    const n = document.getElementById("q"); if (n){ n.focus(); n.setSelectionRange(p, p); } }
});
document.addEventListener("change", e => {
  const f = e.target.closest("[data-f]");
  if (f){ filters[f.getAttribute("data-f")] = f.value; render(); }
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); toggleCmd(); return; }
  if (e.key === "Escape"){ if (cmdOpen) toggleCmd(false); else if (openRef) closePanel(); return; }
  if (e.key === "Enter"){
    if (e.target.id === "cmdInput"){ runCmd(e.target.value); e.target.value = ""; }
    if (e.target.id === "askInput"){ ask(e.target.value); e.target.value = ""; renderThread(); }
    return;
  }
  if (demoStep >= 0 && !/input|textarea|select/i.test(e.target.tagName)){
    if (e.key === "ArrowRight"){ gotoStep(demoStep + 1); e.preventDefault(); }
    if (e.key === "ArrowLeft"){ gotoStep(demoStep - 1); e.preventDefault(); }
  }
});
document.addEventListener("click", e => {
  if (cmdOpen && !e.target.closest(".cmd")) toggleCmd(false);
}, true);

/* dragging cards between stages (pointer based, so mouse, trackpad and touch all work) */
let drag = null, suppressClick = false;

document.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  const card = e.target.closest("[data-card]");
  if (!card) return;
  drag = { ref: card.getAttribute("data-card"), el: card, x0: e.clientX, y0: e.clientY,
           ghost: null, col: null, id: e.pointerId };
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.ghost){
    if (Math.abs(e.clientX - drag.x0) + Math.abs(e.clientY - drag.y0) < 6) return;
    const r = drag.el.getBoundingClientRect();
    drag.ox = drag.x0 - r.left;
    drag.oy = drag.y0 - r.top;
    drag.ghost = drag.el.cloneNode(true);
    drag.ghost.className = drag.el.className + " ghost";
    drag.ghost.style.cssText = "position:fixed;z-index:60;pointer-events:none;width:" + r.width +
      "px;box-shadow:0 8px 24px rgba(21,27,35,.18);opacity:.96;transform:rotate(-1deg)";
    document.body.appendChild(drag.ghost);
    drag.el.classList.add("dragging");
    document.body.style.cursor = "grabbing";
  }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - drag.ox) + "px";
  drag.ghost.style.top = (e.clientY - drag.oy) + "px";
  drag.ghost.style.display = "none";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  drag.ghost.style.display = "";
  const col = under && under.closest(".col[data-stage]");
  if (col !== drag.col){
    if (drag.col) drag.col.classList.remove("dragover");
    if (col) col.classList.add("dragover");
    drag.col = col;
  }
});
function endDrag(){
  if (!drag) return;
  const { ghost, col, ref, el } = drag;
  if (ghost) ghost.remove();
  if (col) col.classList.remove("dragover");
  if (el) el.classList.remove("dragging");
  document.body.style.cursor = "";
  drag = null;
  if (ghost){
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 0);
    if (col) moveShipment(ref, col.getAttribute("data-stage"));
  }
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

/* boot */
render();
